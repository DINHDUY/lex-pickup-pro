# Use with: docker compose --env-file .env.real -f compose.yaml -f compose.real.yaml ...
# The project name gives the real club its own database volume and network.
name: lex-pickup-real
services:
  backend:
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-cosmos}
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:?Set COSMOS_ENDPOINT in .env.real}
      COSMOS_DATABASE: ${COSMOS_DATABASE:-clubs}
      COSMOS_CONTAINER: ${COSMOS_CONTAINER:-club_data}
      COSMOS_CLUB_ID: ${COSMOS_CLUB_ID:-lex-pickup}
      COSMOS_AUTH_MODE: ${COSMOS_AUTH_MODE:-default_credential}
      COSMOS_MANAGED_IDENTITY_CLIENT_ID: ${COSMOS_MANAGED_IDENTITY_CLIENT_ID:-}
      COSMOS_CONSISTENCY_LEVEL: ${COSMOS_CONSISTENCY_LEVEL:-Strong}
      COSMOS_EMULATOR: ${COSMOS_EMULATOR:-false}
      COSMOS_KEY: ${COSMOS_KEY:-}
      COSMOS_MAX_DOCUMENTS: ${COSMOS_MAX_DOCUMENTS:-10000}
      COSMOS_MAX_SNAPSHOT_BYTES: ${COSMOS_MAX_SNAPSHOT_BYTES:-32000000}
      STORAGE_RETRY_ATTEMPTS: ${STORAGE_RETRY_ATTEMPTS:-4}
      DEMO_ENABLED: "false"
      REGISTRATION_ENABLED: "false"
      SESSION_COOKIE_NAME: lex_real_session
      JWT_SECRET: ${REAL_JWT_SECRET:?Set a unique REAL_JWT_SECRET in .env.real}
      FRONTEND_URL: http://localhost:8081
      CORS_ORIGINS: '["http://localhost:8081","http://127.0.0.1:8081"]'
  frontend:
    ports: !override
      - "127.0.0.1:8081:8080"
