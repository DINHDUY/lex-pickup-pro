[project]
name = "lex-pickup-pro-api"
version = "1.0.0"
description = "Club management API for Lex Pickup Pro"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
