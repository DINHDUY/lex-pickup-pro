name: Club checks
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check app tests && uv run pytest -q
        working-directory: backend
      - run: uv run alembic upgrade head && uv run alembic check
        working-directory: backend
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lex
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: lex_test_club
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lex -d lex_test_club"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lex:test-only-password@localhost:5432/lex_test_club
      DEMO_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: backend
      - run: LEX_TEST_DATABASE_URL="$DATABASE_URL" uv run pytest -q
        working-directory: backend
      - run: uv run alembic upgrade head && uv run python -m app.seed --demo && uv run alembic check
        working-directory: backend
      - run: uv run python -m app.verify_postgres
        working-directory: backend
