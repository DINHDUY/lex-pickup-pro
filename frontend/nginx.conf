server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        # Variable proxy_pass + resolver so ACA/Compose DNS is resolved at request time,
        # not at nginx start (Compose hostname "backend" does not exist on ACA).
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $backend "${BACKEND_URL}";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Discard client-supplied forwarding headers. This nginx is the trusted API proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /sw.js { expires -1; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
